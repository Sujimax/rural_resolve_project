<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rural Resolve</title>

  <link rel="icon" href="../images/bgi.png">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/addcomplaint.css">
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <header>
    <nav class="navbar">

      <div class="nav-left">
        <div class="logo">
          <img src="../images/bgi.png" alt="Logo">
          <h1 class="page-title">Rural Resolve</h1>
        </div>
        <button id="menuBtn" class="hamburger">☰</button>
      </div>

      <ul class="nav-links">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="addcomplaint.html" class="active">Add Complaint</a></li>
        <li><a href="my_complaint.html">My Complaint</a></li>
        <li><a href="complaint_list.html">Complaint List</a></li>
      </ul>

      <div class="nav-right">
        <a href="logout.html" class="login-btn">Logout</a>
      </div>

    </nav>
  </header>

  <!-- ================= FORM ================= -->
  <h2>Add a Complaint</h2>

  <div class="class-name" id="add-complaint">
    <form>

      <!-- PROBLEM TYPE -->
      <label for="problem-name">Problem Type:</label>
      <select id="problem-name" required>
        <option value="">-- Select Problem Type --</option>
        <option value="water">Water Issue</option>
        <option value="road">Road Damage</option>
        <option value="electricity">Electricity Issue</option>
        <option value="waste">Waste Management</option>
        <option value="other">Other</option>
      </select>

      <!-- OTHER PROBLEM -->
      <input type="text" id="other-problem" placeholder="Enter problem type" style="display:none" />

      <!-- IMAGE -->
      <label for="image">Upload Image:</label>
      <input type="file" id="image" accept="image/*">

      <!-- DESCRIPTION -->
      <label for="description">Problem Description:</label>
      <textarea id="description" rows="4" placeholder="Describe your problem..." required></textarea>

      <!-- DISTRICT -->
      <label for="district">District:</label>
      <select id="district" required>
        <option value="">-- Select District --</option>
      </select>

      <!-- OTHER DISTRICT -->
      <input type="text" id="other-district" placeholder="Enter district name" style="display:none" />

      <!-- VILLAGE -->
      <label for="village">Village:</label>
      <select id="village" required>
        <option value="">-- Select Village --</option>
      </select>

      <!-- OTHER VILLAGE -->
      <input type="text" id="other-village" placeholder="Enter village name" style="display:none" />

      <!-- ADDRESS -->
      <label for="address">Address:</label>
      <input type="text" id="address" placeholder="Enter your current address and door number" required />

      <!-- SUBMIT -->
      <button type="submit">Submit Complaint</button>

    </form>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script src="../javascript/navbar.js"></script>
  <script type="module" src="../javascript/add_complaint.js"></script>

</body>

</html>
