<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rural Resolve</title>

  <link rel="icon" href="../images/bgi.png">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/addcomplaint.css">
</head>

<body>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar">

      <div class="nav-left">
        <div class="logo">
          <img src="../images/bgi.png" alt="Logo">
          <h1 class="page-title">Rural Resolve</h1>
        </div>
        <button id="menuBtn" class="hamburger">☰</button>
      </div>

      <ul class="nav-links">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="addcomplaint.html" class="active">Add Complaint</a></li>
        <li><a href="my_complaint.html">My Complaint</a></li>
        <li><a href="complaint_list.html">Complaint List</a></li>
      </ul>

      <div class="nav-right">
        <a href="logout.html" class="login-btn">Logout</a>
      </div>

    </nav>
  </header>



<h2>Add Complaint</h2>

<div class="class-name">
<form id="complaintForm" enctype="multipart/form-data">

  <label>Problem Type</label>
  <select id="problem-name" required>
    <option value="">-- Select --</option>
    <option value="Water Issue">Water Issue</option>
    <option value="Road Damage">Road Damage</option>
    <option value="Electricity Issue">Electricity Issue</option>
    <option value="Waste Management">Waste Management</option>
    <option value="other">Other</option>
  </select>

  <!-- REQUIRED -->
  <input
    type="text"
    id="problem-other"
    placeholder="Enter your problem"
    style="display:none;"
  />

  <label>Image</label>
  <input type="file" id="image" accept="image/*">

  <label>Description</label>
  <textarea id="description" required></textarea>

  <label>District</label>
  <select id="district" required>
    <option value="">-- Select District --</option>
  </select>

  <label>Village</label>
  <select id="village" required>
    <option value="">-- Select Village --</option>
  </select>

  <label>Address</label>
  <input type="text" id="address" required>

  <button type="submit">Submit Complaint</button>

</form>
</div>

<script type="module" src="../javascript/add_complaint.js"></script>
</body>
</html>
