<!DOCTYPE html>

  <link rel="icon" href="../images/bgi.png">
  <link rel="stylesheet" href="../css/navbar.css">

</head>

<body>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar">

      <div class="nav-left">
        <div class="logo">
          <img src="../images/bgi.png" alt="Logo">
          <h1 class="page-title">Rural Resolve</h1>
        </div>
        <button id="menuBtn" class="hamburger">☰</button>
      </div>

      <ul class="nav-links">
        <li><a href="dashboard.html">Home</a></li>

      </div>

    </nav>
  </header>



  <h2>Add a Complaint</h2>

<!-- ================= FORM ================= -->
<div class="class-name">
  <form id="complaintForm" enctype="multipart/form-data">

    <!-- PROBLEM TYPE -->
    <label for="problem-name">Problem Type:</label>
    <select id="problem-name" name="problem-name" required>
      <option value="">-- Select Problem Type --</option>
      <option value="Water Issue">Water Issue</option>
      <option value="Road Damage">Road Damage</option>
      <option value="Electricity Issue">Electricity Issue</option>
      <option value="Waste Management">Waste Management</option>
      <option value="other">Other</option>
    </select>

    <!-- IMAGE -->
    <label for="image">Upload Image:</label>
    <input type="file" id="image" name="image" accept="image/*" />

    <!-- DESCRIPTION -->
    <label for="description">Problem Description:</label>
    <textarea id="description" name="description" rows="4" required></textarea>

    <!-- DISTRICT -->
    <label for="district">District:</label>
    <select id="district" name="district" required>
      <option value="">-- Select District --</option>
    </select>

    <!-- VILLAGE -->
    <label for="village">Village:</label>
    <select id="village" name="village" required>
      <option value="">-- Select Village --</option>
    </select>

    <!-- ADDRESS -->
    <label for="address">Address:</label>
    <input type="text" id="address" name="address" required />

    <!-- SUBMIT -->
    <button type="submit">Submit Complaint</button>

  </form>
</div>

  <script type="module" src="../javascript/add_complaint.js"></script>
</body>

</html>
