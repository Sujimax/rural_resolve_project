<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rural Resolve</title>
  <link rel="icon" href="../images/bgi.png" alt="Village website">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/addcomplaint.css">
</head>

<body>
  <header>
    <nav class="navbar">

      <!-- LEFT -->
      <div class="nav-left">
        <div class="logo">
          <img src="../images/bgi.png" alt="Logo">
          <h1 class="page-title">Rural Resolve</h1>
        </div>

        <!-- MENU BUTTON (JS BASED) -->
        <button id="menuBtn" class="hamburger">☰</button>
      </div>

      <!-- CENTER LINKS -->
      <ul class="nav-links">
        <li><a href="dashboard.html" class="active">Home</a></li>
        <li><a href="addcomplaint.html">Add Complaint</a></li>
        <li><a href="complaint_list.html">Complaint List</a></li>
      </ul>

       <div class="nav-right">

        <span class="welcome-user" id="welcomeUser">Welcome, <span id="user"></span></span>
        <span class="notification">🔔</span>
        <div class="language">
          <img src="../images/translate.jpg" alt="Language" id="langIcon">

          <div id="languageDropdown" class="language-dropdown">
            <p onclick="translatePage('en')">English</p>
            <p onclick="translatePage('ta')">Tamil</p>
          </div>
        </div>

        <a href="logout.html" class="login-btn">Logout</a>
      </div>

    </nav>
  </header>

  <h2>Edit a Complaint</h2>

  <div class="class-name">

    <form id="editComplaintForm">

      <label for="problem_type">Problem Type</label>
      <input type="text" id="problem_type" name="problem_type" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" required></textarea>

      <label for="district">District</label>
      <input type="text" id="district" name="district" required>

      <label for="village">Village</label>
      <input type="text" id="village" name="village" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required>

      <button type="submit">Update Complaint</button>
    </form>

    <p id="statusMessage" style="color:green; margin-top:10px;"></p>
  </div>

  <script type="module" src="../javascript/edit_complaint.js"></script>
  <script src="../javascript/navbar.js"></script>
<script src="../javascript/language.js"></script>
</body>
</html>
