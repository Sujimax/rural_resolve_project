<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Complaint Website</title>
  <link rel="icon" href="../images/bgi.png" alt="Village website">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/addcomplaint.css">
</head>

<body>

  <header>
    <nav class="navbar">
      <div class="nav-left">
        <div class="logo">
          <img src="../images/bgi.png" alt="Logo">
          <h1 class="page-title">Rural Resolve</h1>
        </div>

        <button id="menuBtn" class="hamburger">☰</button>
      </div>

      <div class="nav-right">

        <div class="language">
          <img src="../images/translate.jpg" alt="Language" id="langIcon">

          <div id="languageDropdown" class="language-dropdown">
            <p onclick="translatePage('en')">English</p>
            <p onclick="translatePage('ta')">Tamil</p>
          </div>
        </div>


        <!-- Google Translate Hidden Container -->
        <div id="google_translate_element" style="display:none;"></div>

        <a href="../../index.html" class="login-btn">Back to Home</a>

      </div>
    </nav>
  </header>

  <main>
    <h2>Login</h2>

    <div class="form-container">
      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required />
        <div class="password-wrapper">
          <input type="password" name="password" placeholder="Password" required />

          <img src="../images/view.png" class="toggle-password" data-show="../images/view.png"
            data-hide="../images/hide.png" alt="Show Password">
        </div>


        <button type="submit">Login</button>
      </form>

      <p>If you don't have an account? <a href="signup.html">Signup</a></p>
    </div>
  </main>

  <script type="module" src="/frontend/javascript/navbar.js"></script>
  <script type="module" src="../javascript/login.js"></script>
  <script src="../javascript/language.js"></script>

</body>

</html>
