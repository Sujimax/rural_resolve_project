<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Complaint Website</title>
    <link rel="icon" href="../images/bgi.png" alt="Village website">
    <link rel="stylesheet" href="../css/addcomplaint.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <div class="logo">
                    <img src="../images/bgi.png" alt="Logo">
                    <h1 class="page-title">Rural Resolve</h1>
                </div>
                <button id="menuBtn" class="hamburger">☰</button>
            </div>

            <div class="nav-right">

                <div class="language">
                    <img src="../images/translate.jpg" alt="Language" id="langIcon">

                    <div id="languageDropdown" class="language-dropdown">
                        <p onclick="translatePage('en')">English</p>
                        <p onclick="translatePage('ta')">Tamil</p>
                    </div>
                </div>
                <div id="google_translate_element" style="display:none;"></div>
                <a href="../../index.html" class="login-btn">Back to Home</a>

            </div>
        </nav>
    </header>

    <h2>Signup</h2>

    <div class="form-container">
        <form id="signup-form">
            
            <!-- Name -->
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone number" required>

            <!-- Email -->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <!-- Password -->
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <span class="password-status"></span>
                <img src="../images/view.png" class="toggle-password" data-show="../images/view.png"
                    data-hide="../images/hide.png" alt="Toggle Password">
            </div>

            <!-- Confirm Password -->
            <label for="confirm_password">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password"
                    required>
                <span class="password-status"></span>
                <img src="../images/view.png" class="toggle-password" data-show="../images/view.png"
                    data-hide="../images/hide.png" alt="Toggle Password">
            </div>

            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script type="module" src="../javascript/signup.js"></script>
    <script src="../javascript/navbar.js"></script>
    <script src="../javascript/language.js"></script>
</body>

</html>
