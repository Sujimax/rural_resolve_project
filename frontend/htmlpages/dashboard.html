<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rural Resolve</title>

  <link rel="icon" href="../images/bgi.png" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/dash_page.css" />
</head>

<body>

<header>
  <nav class="navbar">

    <div class="nav-left">
      <div class="logo">
        <img src="../images/bgi.png" alt="Logo">
        <h1 class="page-title">Rural Resolve</h1>
      </div>
      <button id="menuBtn" class="hamburger">☰</button>
    </div>

    <ul class="nav-links">
      <li><a href="dashboard.html" class="active">Home</a></li>
      <li><a href="addcomplaint.html">Add Complaint</a></li>
      <li><a href="my_complaint.html">My Complaint</a></li>
      <li><a href="complaint_list.html">Complaint List</a></li>
    </ul>

    <div class="nav-right">
      <span class="welcome-user" id="welcomeUser">Welcome</span>
      <div class="notification">🔔</div>
      <a href="logout.html" class="login-btn">Logout</a>
    </div>

  </nav>
</header>

<section class="hero">
  <div class="hero-container">
    <div class="hero-left">
      <img src="../images/icon1.png" alt="Village illustration">
    </div>
    <div class="hero-right">
      <h1>
        <span class="normal-text">Welcome to </span>
        <span class="gradient-text">Rural Resolve</span>
      </h1>
      <p>Empowering villages through digital complaint management.</p>
      <div class="hero-buttons">
        <a href="addcomplaint.html"><button>Add Complaint</button></a>
        <a href="my_complaint.html"><button>My Complaints</button></a>
      </div>
    </div>
  </div>
</section>

<footer>
  <p>&copy; 2025 Rural Resolve</p>
</footer>

<script src="../javascript/navbar.js"></script>

<script>
  // ====== FINAL USER DISPLAY LOGIC ======
  document.addEventListener("DOMContentLoaded", () => {
    const welcomeUser = document.getElementById("welcomeUser");
    const token = localStorage.getItem("access_token");

    if (!token) {
      welcomeUser.textContent = "Welcome, Guest";
      return;
    }

    try {
      const payload = JSON.parse(atob(token.split(".")[1]));

      // Try name → email → id
      const displayName =
        payload.name ||
        payload.username ||
        payload.email ||
        (payload.id ? `User ${payload.id}` : "User");

      welcomeUser.textContent = `Welcome, ${displayName}`;
    } catch (err) {
      console.error("Token decode failed", err);
      welcomeUser.textContent = "Welcome, User";
    }
  });
</script>

</body>
</html>
