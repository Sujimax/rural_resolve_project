<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rural Resolve</title>

  <link rel="icon" href="../images/bgi.png" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/dash_page.css" />
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <header>
    <nav class="navbar">

      <!-- LEFT -->
      <div class="nav-left">
        <div class="logo">
          <img src="../images/bgi.png" alt="Logo">
          <h1 class="page-title">Rural Resolve</h1>
        </div>
        <button id="menuBtn" class="hamburger">☰</button>
      </div>

      <!-- CENTER -->
      <ul class="nav-links">
        <li><a href="dashboard.html" class="active">Home</a></li>
        <li><a href="addcomplaint.html">Add Complaint</a></li>
        <li><a href="my_complaint.html">My Complaint</a></li>
        <li><a href="complaint_list.html">Complaint List</a></li>
      </ul>

      <!-- RIGHT -->
      <div class="nav-right">
        <span class="welcome-user" id="welcomeUser">Welcome</span>
        <span class="notification">🔔</span>
        <a href="logout.html" class="login-btn">Logout</a>
      </div>

    </nav>
  </header>

  <!-- ================= HERO ================= -->
  <section class="hero">
    <div class="hero-container">

      <div class="hero-left">
        <img src="../images/icon1.png" alt="Village illustration">
      </div>

      <div class="hero-right">
        <h1>
          <span class="normal-text">Welcome to </span>
          <span class="gradient-text">Rural Resolve</span>
        </h1>
        <p>Empowering villages through digital complaint management.</p>

        <div class="hero-buttons">
          <a href="addcomplaint.html"><button>Add Complaint</button></a>
          <a href="my_complaint.html"><button>My Complaints</button></a>
        </div>
      </div>

    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>&copy; 2025 Rural Resolve</p>
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <script type="module" src="../javascript/dashboard.js"></script>
<script>
  import API_BASE_URL from "./config.js";

document.addEventListener("DOMContentLoaded", async () => {
  const welcomeUser = document.getElementById("welcomeUser");
  const token = localStorage.getItem("access_token");

  if (!token) {
    window.location.href = "login.html";
    return;
  }

  try {
    const res = await fetch(`${API_BASE_URL}/complaints/me`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    if (!res.ok) throw new Error("Unauthorized");

    const complaints = await res.json();

    // ✅ YOUR BACKEND GUARANTEES THIS
    if (complaints.length > 0) {
      welcomeUser.textContent = `Welcome, ${complaints[0].user_name}`;
    } else {
      welcomeUser.textContent = "Welcome";
    }

  } catch (err) {
    console.error("Dashboard username error:", err);
    welcomeUser.textContent = "Welcome";
  }
});

</script>
</body>
</html>
